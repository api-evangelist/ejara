aid: ejara
name: Ejara
description: >-
  Ejara is a Cameroon-based, regulated fintech platform giving people across
  Francophone Africa and its diaspora access to digital savings and investment
  products through a mobile app. Founded in 2020 in Douala by Nelly Chatue-Diop,
  Baptiste Andrieux, and Tierno Tall, Ejara lets users save from as little as
  1,000 CFA francs in BEAC-guaranteed savings plans earning up to 5% annual
  interest, and buy, sell, and self-custody cryptocurrencies such as Bitcoin,
  Ethereum, and stablecoins using blockchain-based non-custodial wallets. The
  company is licensed by COSUMAF in the CEMAC zone (SGP-06/2021) and registered
  with France's Autorite des marches financiers (AMF-E2022-056), and raised an
  $8M Series A led by Anthemis and Dragonfly. Ejara operates as a consumer
  mobile application on iOS and Android rather than a public API provider; this
  profile tracks its developer surface, including open-source blockchain
  libraries on GitHub, for the API Evangelist network.
